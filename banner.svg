<svg width="100%" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="50%" stop-color="#131a2b"/>
      <stop offset="100%" stop-color="#0b0f1a"/>
    </linearGradient>

    <linearGradient id="titleFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#22d3ee;#8b5cf6" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#8b5cf6;#22d3ee" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#22d3ee;#a78bfa" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="280" fill="url(#bg)"/>

  <!-- ambient glow blobs, slowly drifting -->
  <circle cx="180" cy="70" r="160" fill="url(#glow)" filter="url(#softBlur)">
    <animate attributeName="cx" values="180;260;180" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1020" cy="210" r="180" fill="url(#glow)" filter="url(#softBlur)">
    <animate attributeName="cx" values="1020;940;1020" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- subtle grid lines for depth -->
  <g stroke="#242c42" stroke-width="1" opacity="0.5">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
  </g>

  <!-- floating particles -->
  <g fill="#a78bfa">
    <circle cx="90" cy="220" r="3">
      <animate attributeName="cy" values="220;190;220" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1120" cy="60" r="3">
      <animate attributeName="cy" values="60;90;60" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1060" cy="150" r="2.5">
      <animate attributeName="cy" values="150;125;150" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.15;0.7" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="90" r="2.5">
      <animate attributeName="cy" values="90;115;90" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 3D layered title: dark stacked shadow copies behind, gradient fill on top -->
  <g font-family="Verdana, Arial, sans-serif" font-weight="900" text-anchor="middle">
    <text x="604" y="150" font-size="80" fill="#050810" opacity="0.9">SAYAM DAS</text>
    <text x="602" y="147" font-size="80" fill="#0a0e18" opacity="0.9">SAYAM DAS</text>
    <text x="600" y="144" font-size="80" fill="url(#titleFill)" filter="url(#dropShadow)">
      SAYAM DAS
      <animate attributeName="opacity" values="1;0.85;1" dur="3s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- subtitle -->
  <text x="600" y="190" font-family="Consolas, 'Courier New', monospace" font-size="20"
        fill="#9CA3AF" text-anchor="middle" letter-spacing="2">
    FULL-STACK ENGINEER &#8226; AI / ML PRACTITIONER
  </text>

  <!-- animated underline -->
  <rect x="450" y="205" width="300" height="3" fill="url(#titleFill)" rx="2">
    <animate attributeName="width" values="0;300;300;0" keyTimes="0;0.3;0.7;1" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="x" values="600;450;450;600" keyTimes="0;0.3;0.7;1" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
