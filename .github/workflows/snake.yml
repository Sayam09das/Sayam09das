name: Generate Tulkun Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    concurrency:
      group: output-branch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Generate Tulkun animation
        uses: PramudithaN/git-tulkun@v1
        with:
          login: ${{ github.repository_owner }}
          view: side
          window: annual
          output-dir: dist/tulkun
          commit: "false"

      - name: Publish Tulkun animation
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
